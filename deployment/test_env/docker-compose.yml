version: '3.8'

# ==============================================================================
# MinerU PDF 解析服务 - 测试环境配置
# ==============================================================================
# 与 dev 环境核心差异：
#   1. 不挂载 mineru/ 卷（测试环境无需代码热重载）
#   2. restart=always（测试环境需自动恢复）
#   3. 端口 8000（统一端口）
#   4. LOG_LEVEL=INFO（关闭 DEBUG 详细堆栈）
#   5. 提高线程数和并发数，模拟生产负载
#   6. 减少任务保留时间，节省磁盘
# ==============================================================================
# 使用方式:
#   ./build.sh deploy          # 构建并启动
#   ./build.sh build           # 仅构建镜像
#   ./build.sh start           # 仅启动（镜像已存在）
#   ./build.sh stop            # 停止服务
#   ./build.sh restart         # 重启（不重建镜像）
#   ./build.sh rebuild         # 重新构建镜像并重启
#   ./build.sh logs            # 查看实时日志
#   ./build.sh status          # 查看容器状态
# ==============================================================================

services:
  mineru-api:
    build:
      context: ../..
      dockerfile: deployment/test_env/Dockerfile
    image: mineru:test
    container_name: mineru-api-test

    ports:
      - "8000:8000"

    env_file:
      - .env.test

    environment:
      # ---------- 线程与性能 ----------
      # PDF 渲染线程数（默认 4），测试环境使用默认值
      - MINERU_PDF_RENDER_THREADS=4
      # PDF 渲染超时（秒）
      - MINERU_PDF_RENDER_TIMEOUT=300
      # ONNX Runtime 线程数
      - OMP_NUM_THREADS=4

      # ---------- 并发与批处理 ----------
      # API 最大并发请求数（默认 3），测试环境提高
      - MINERU_API_MAX_CONCURRENT_REQUESTS=6
      # 批处理窗口大小（pipeline 后端每批最大页数）
      - MINERU_PROCESSING_WINDOW_SIZE=64

      # ---------- 模型和计算 ----------
      - MINERU_MODEL_SOURCE=modelscope
      # 测试环境通常使用 CPU，有 GPU 可改为 cuda
      - MINERU_DEVICE_MODE=cpu

      # ---------- 功能开关 ----------
      - MINERU_FORMULA_ENABLE=true
      - MINERU_TABLE_ENABLE=true

      # ---------- 任务管理 ----------
      - MINERU_API_OUTPUT_ROOT=/app/output
      # 测试环境保留 6h
      - MINERU_API_TASK_RETENTION_SECONDS=21600
      - MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS=600

      # ---------- 日志 ----------
      - MINERU_LOG_LEVEL=INFO
      - MINERU_API_DISABLE_ACCESS_LOG=false

      # ---------- 接口文档 ----------
      # 测试环境开启以便调试
      - MINERU_API_ENABLE_FASTAPI_DOCS=true

    volumes:
      # 模型缓存持久化
      - ./models:/root/.cache/modelscope/hub/models
      # 输出目录持久化
      - ./output:/app/output
      # 日志持久化
      - ./logs:/app/logs

      # 注意：测试环境不挂载 mineru/，确保镜像内代码稳定

    restart: "always"

    ulimits:
      memlock: -1
      stack: 67108864

    ipc: host

    # 测试环境资源限制
    mem_limit: "8g"
    mem_reservation: "2g"
    cpus: "4"

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    networks:
      - mineru-test-network

networks:
  mineru-test-network:
    driver: bridge
