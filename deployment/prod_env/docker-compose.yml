version: '3.8'

# ==============================================================================
# MinerU PDF 解析服务 - 生产环境配置
# ==============================================================================
# 与 dev/test 环境核心差异：
#   1. 不挂载 mineru/ 卷（代码稳定不可变）
#   2. restart=always（自动恢复）
#   3. 端口 8002（隔离环境）
#   4. 关闭 API 文档（MINERU_API_ENABLE_FASTAPI_DOCS=0）
#   5. 关闭 DEBUG 日志和访问日志
#   6. 最大资源限制和线程数，充分发挥硬件性能
#   7. 更长的任务保留时间，便于回溯
#   8. 关闭 STDIN EOF 自动关闭（作为常驻服务）
#   9. 如使用 GPU，需额外配置 nvidia runtime
# ==============================================================================
# 使用方式:
#   ./build.sh deploy          # 构建并启动
#   ./build.sh build           # 仅构建镜像
#   ./build.sh start           # 仅启动（镜像已存在）
#   ./build.sh stop            # 停止服务
#   ./build.sh restart         # 重启（不重建镜像）
#   ./build.sh rebuild         # 重新构建镜像并重启
#   ./build.sh logs            # 查看实时日志
#   ./build.sh status          # 查看容器状态
# ==============================================================================

services:
  mineru-api:
    build:
      context: ../..
      dockerfile: deployment/prod_env/Dockerfile
    image: mineru:prod
    container_name: mineru-api-prod

    ports:
      - "8002:8000"

    env_file:
      - .env.prod

    environment:
      # ---------- 线程与性能 ----------
      # PDF 渲染线程数（默认 4），生产环境使用最大值 4
      - MINERU_PDF_RENDER_THREADS=4
      # PDF 渲染超时（秒），生产环境提高容忍度
      - MINERU_PDF_RENDER_TIMEOUT=600
      # ONNX Runtime 线程数，充分利用 CPU
      - OMP_NUM_THREADS=8
      # MKL 线程数（如使用 Intel MKL）
      - MKL_NUM_THREADS=8
      # OpenBLAS 线程数
      - OPENBLAS_NUM_THREADS=8

      # ---------- 并发与批处理 ----------
      # API 最大并发请求数
      - MINERU_API_MAX_CONCURRENT_REQUESTS=8
      # 批处理窗口大小
      - MINERU_PROCESSING_WINDOW_SIZE=64

      # ---------- 模型和计算 ----------
      - MINERU_MODEL_SOURCE=modelscope
      # 有 GPU 建议设为 cuda
      - MINERU_DEVICE_MODE=auto

      # ---------- 功能开关 ----------
      - MINERU_FORMULA_ENABLE=true
      - MINERU_TABLE_ENABLE=true

      # ---------- 任务管理 ----------
      - MINERU_API_OUTPUT_ROOT=/app/output
      # 生产环境保留 48h
      - MINERU_API_TASK_RETENTION_SECONDS=172800
      - MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS=900

      # ---------- 日志 ----------
      # 生产环境只输出 WARNING 及以上
      - MINERU_LOG_LEVEL=WARNING
      # 关闭 HTTP 访问日志
      - MINERU_API_DISABLE_ACCESS_LOG=true

      # ---------- 接口文档 ----------
      # 生产环境关闭 API 文档
      - MINERU_API_ENABLE_FASTAPI_DOCS=false

      # ---------- 安全 ----------
      # 绑定 0.0.0.0 时默认禁止 http-client 后端，生产环境明确控制
      # MINERU_API_ALLOW_PUBLIC_HTTP_CLIENT=0
      # 禁止 STDIN EOF 自动关闭
      - MINERU_API_SHUTDOWN_ON_STDIN_EOF=false

      # ---------- VLM 预加载 ----------
      # 生产环境启用以减少首次请求延迟（需评估内存是否充足）
      - MINERU_API_ENABLE_VLM_PRELOAD=false

    volumes:
      # 模型缓存持久化
      - ./models:/root/.cache/modelscope/hub/models
      # 输出目录持久化（生产环境建议挂载高性能磁盘或对象存储）
      - ./output:/app/output
      # 日志持久化
      - ./logs:/app/logs

      # 注意：生产环境不挂载 mineru/，确保镜像内代码不可变

    restart: "always"

    ulimits:
      memlock: -1
      stack: 67108864

    ipc: host

    # 生产环境资源限制（根据实际硬件调整）
    mem_limit: "16g"
    mem_reservation: "4g"
    cpus: "8"

    # 如使用 NVIDIA GPU，取消下面的注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    dns:
      - 8.8.8.8
      - 114.114.114.114

    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - mineru-prod-network

networks:
  mineru-prod-network:
    driver: bridge
