version: '3.8'

# ==============================================================================
# MinerU PDF 解析服务 - 开发环境配置
# ==============================================================================
# 使用方式:
#   ./build.sh deploy          # 构建并启动
#   ./build.sh build           # 仅构建镜像
#   ./build.sh start           # 仅启动（镜像已存在）
#   ./build.sh stop            # 停止服务
#   ./build.sh restart         # 重启（不重建镜像）
#   ./build.sh rebuild         # 重新构建镜像并重启
#   ./build.sh logs            # 查看实时日志
#   ./build.sh status          # 查看容器状态
# ==============================================================================

services:
  mineru-api:
    build:
      context: ../..                    # 项目根目录
      dockerfile: deployment/dev_env/Dockerfile
    image: mineru:dev
    container_name: mineru-api-dev

    ports:
      - "8000:8000"

    env_file:
      - .env.dev

    environment:
      # ---------- 线程与性能 ----------
      # PDF 渲染线程数（默认 4），开发环境 1 足够
      - MINERU_PDF_RENDER_THREADS=1
      # PDF 渲染超时（秒），默认 300
      - MINERU_PDF_RENDER_TIMEOUT=300
      # ONNX Runtime 线程数，控制模型推理并发
      - OMP_NUM_THREADS=2

      # ---------- 并发与批处理 ----------
      # API 最大并发请求数（默认 3），开发环境降低
      - MINERU_API_MAX_CONCURRENT_REQUESTS=3
      # Processing Window Size（pipeline 模式下每批最大页数，默认 64）
      - MINERU_PROCESSING_WINDOW_SIZE=64

      # ---------- 模型和计算 ----------
      - MINERU_MODEL_SOURCE=modelscope
      # 计算设备：auto 自动选择 GPU > CPU; 或指定 cpu/cuda/mps
      - MINERU_DEVICE_MODE=auto

      # ---------- 功能开关 ----------
      - MINERU_FORMULA_ENABLE=true
      - MINERU_TABLE_ENABLE=true

      # ---------- 任务管理 ----------
      - MINERU_API_OUTPUT_ROOT=/app/output
      # 任务结果保留时间（秒），默认 86400（24h），开发环境保留 1h
      - MINERU_API_TASK_RETENTION_SECONDS=3600
      # 清理检查间隔（秒），默认 300
      - MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS=300

      # ---------- 日志 ----------
      - MINERU_LOG_LEVEL=DEBUG
      - MINERU_API_DISABLE_ACCESS_LOG=false

      # ---------- 接口文档 ----------
      - MINERU_API_ENABLE_FASTAPI_DOCS=true

    volumes:
      # 模型缓存持久化
      - ./models:/root/.cache/modelscope/hub/models
      # 输出目录持久化
      - ./output:/app/output
      # 日志持久化
      - ./logs:/app/logs
      # 开发模式：代码热重载
      - ../../mineru:/app/mineru

    restart: "no"

    ulimits:
      memlock: -1
      stack: 67108864

    ipc: host

    # 开发环境低资源限制
    mem_limit: "4g"
    mem_reservation: "1g"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - mineru-dev-network

networks:
  mineru-dev-network:
    driver: bridge
